server:
  address: 127.0.0.1
  port: 8080
spring:
  application:
    name: zhiku-scaffold
  config:
    # Local developer settings only; .env is git-ignored and never required in tests.
    import: optional:file:../.env[.properties]
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  datasource:
    url: ${ZHIKU_DB_URL:jdbc:postgresql://127.0.0.1:5432/zhiku}
    username: ${POSTGRES_USER:zhiku_local}
    password: ${POSTGRES_PASSWORD:}
  flyway:
    clean-disabled: true
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 21MB
zhiku:
  business:
    # Business dates (effective from/until) are interpreted in this zone; storage is UTC.
    time-zone: Asia/Shanghai
  ingestion:
    max-bytes: 20971520
    chunk-max-chars: 800
    chunk-overlap: 100
    max-chunks: 20000
    lease-seconds: 300
    max-attempts: 3
    worker-enabled: true
    poll-interval: PT2S
  embedding:
    # none | ollama. With none, ingestion stores chunks but marks versions failed: nothing becomes searchable without vectors.
    provider: ${ZHIKU_EMBEDDING_PROVIDER:none}
    base-url: ${ZHIKU_OLLAMA_URL:http://127.0.0.1:11434}
    model: ${ZHIKU_EMBEDDING_MODEL:bge-m3}
    batch-size: 32
    timeout: PT60S
  chat:
    # none | ollama. With none, POST /api/chat returns 503.
    provider: ${ZHIKU_CHAT_PROVIDER:none}
    base-url: ${ZHIKU_OLLAMA_URL:http://127.0.0.1:11434}
    model: ${ZHIKU_CHAT_MODEL:qwen3.5:latest}
    context-chunks: 5
    max-chunk-chars: 1500
    timeout: PT120S
    stream-timeout: PT150S
  widget:
    token-ttl: PT10M
    # Explicit host origins allowed to call /api/chat from the browser. Empty means no CORS at all.
    allowed-origins: ${ZHIKU_WIDGET_ORIGINS:}
  retrieval:
    default-k: 8
    max-k: 30
  auth:
    # HS256 key for locally issued tokens; at least 32 bytes. Empty means every token is rejected.
    jwt-secret: ${ZHIKU_JWT_SECRET:}
    issuer: zhiku-local
    audience: zhiku-api
