server:
  address: 127.0.0.1
  port: 8080
spring:
  application:
    name: zhiku-scaffold
  config:
    # 仅用于本地开发设置；.env 已被 git 忽略，测试中从不需要。
    import: optional:file:../.env[.properties]
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  datasource:
    url: ${ZHIKU_DB_URL:jdbc:postgresql://127.0.0.1:5432/zhiku}
    username: ${POSTGRES_USER:zhiku_local}
    password: ${POSTGRES_PASSWORD:}
  flyway:
    clean-disabled: true
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 21MB
zhiku:
  business:
    # 业务日期（生效 from/until）按此时区解释；存储使用 UTC。
    time-zone: Asia/Shanghai
  document:
    # 文档删除后在后台移除内容、chunk 和向量（读取立即停止）。
    cleanup-enabled: true
    cleanup-poll-interval: PT10S
  ingestion:
    max-bytes: 20971520
    chunk-max-chars: 800
    chunk-overlap: 100
    max-chunks: 20000
    lease-seconds: 300
    max-attempts: 3
    worker-enabled: true
    poll-interval: PT2S
  embedding:
    # none | ollama。为 none 时，导入会保存 chunk 但将版本标记为失败：没有向量就无法被检索。
    provider: ${ZHIKU_EMBEDDING_PROVIDER:none}
    base-url: ${ZHIKU_OLLAMA_URL:http://127.0.0.1:11434}
    model: ${ZHIKU_EMBEDDING_MODEL:bge-m3}
    batch-size: 32
    timeout: PT60S
  chat:
    # none | ollama。为 none 时，POST /api/chat 返回 503。
    provider: ${ZHIKU_CHAT_PROVIDER:none}
    base-url: ${ZHIKU_OLLAMA_URL:http://127.0.0.1:11434}
    model: ${ZHIKU_CHAT_MODEL:qwen3.5:latest}
    context-chunks: 5
    max-chunk-chars: 1500
    # 单次模型调用从请求到最后一个片段的总时长；浏览器端流的超时更晚。
    timeout: PT120S
    # 模型流超过此时长没有新数据即放弃。
    idle-timeout: PT30S
    # 更长的回答会被停止并丢弃（ANSWER_TOO_LONG），绝不截断为已完成回答。
    max-answer-chars: 8000
    stream-timeout: PT150S
    # 等待检索或模型期间按此间隔发送 SSE 注释保持连接；注释不是内容，客户端忽略。
    heartbeat-interval: PT15S
    # 拒答与敏感输入提示中指向的人工渠道，由业务负责人确认后填写；为空时提示"尚未配置"。
    handoff-channel: ${ZHIKU_HANDOFF_CHANNEL:}
    # 单个会话的轮次上限：续问依赖随轮次累积，超过后要求新建会话。
    max-turns: 100
    # 草稿流式输出期间，授权和来源效力最多按此频率重新读取；变更会在此间隔内被发现。
    recheck-interval: PT1S
  widget:
    token-ttl: PT10M
    # 允许从浏览器调用 /api/chat 的显式宿主 origin。为空表示完全不启用 CORS。
    allowed-origins: ${ZHIKU_WIDGET_ORIGINS:}
  retrieval:
    default-k: 8
    max-k: 30
  auth:
    # 本地签发 token 的 HS256 密钥；至少 32 字节。为空表示拒绝所有 token。
    jwt-secret: ${ZHIKU_JWT_SECRET:}
    issuer: zhiku-local
    audience: zhiku-api
