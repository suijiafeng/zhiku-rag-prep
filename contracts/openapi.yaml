openapi: 3.1.0
info:
  title: 知库 scaffold API
  version: 0.1.0-draft
  description: PRD v0.3 preparation. Only status endpoint implemented. SSE schemas are provisional, no chat route exists.
servers:
  - url: http://127.0.0.1:8080
paths:
  /api/status:
    get:
      operationId: getStatus
      security: []
      responses:
        '200':
          description: Non-sensitive scaffold status
          content:
            application/json:
              schema:
                type: object
                required: [name, stage, prdVersion, modelEnabled]
                properties:
                  name: {type: string}
                  stage: {type: string, const: scaffold}
                  prdVersion: {type: string, const: '0.3'}
                  modelEnabled: {type: boolean, const: false}
components:
  responses:
    Unauthenticated:
      description: No trusted server-side identity. Body never reveals whether the path or resource exists.
      headers:
        X-Request-Id: {schema: {type: string}}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
          example: {code: UNAUTHENTICATED, message: Authentication required, requestId: 00000000-0000-0000-0000-000000000000}
    Forbidden:
      description: Identity exists but the target is not granted, or CSRF check failed. Identical for foreign and unknown targets.
      headers:
        X-Request-Id: {schema: {type: string}}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
          example: {code: FORBIDDEN, message: Access denied, requestId: 00000000-0000-0000-0000-000000000000}
  schemas:
    Error:
      type: object
      required: [code, message, requestId]
      properties:
        code: {type: string}
        message: {type: string}
        requestId: {type: string}
    Draft:
      type: object
      required: [text]
      properties:
        text: {type: string}
    Citation:
      type: object
      required: [documentId, versionId, title, excerpt]
      properties:
        documentId: {type: string}
        versionId: {type: string}
        title: {type: string}
        excerpt: {type: string}
    Validated:
      type: object
      description: Source metadata checks only; not semantic verification.
      required: [citations, validation]
      properties:
        citations:
          type: array
          items: {$ref: '#/components/schemas/Citation'}
        validation: {type: string, const: metadata-only}
    Done:
      type: object
      required: [status]
      properties:
        status: {type: string, const: complete}
x-sse-draft:
  status: provisional-not-implemented
  transport: POST with fetch; no route yet
  events: [draft, validated, error, done]
  rules:
    - All events use JSON data. Error is terminal. Done requires preceding validated.
    - Draft is provisional. Metadata validation does not establish semantic correctness.
    - Disconnect, cancellation or error must not preserve a usable answer.
x-auth-draft:
  status: port-and-tests-only; identity source, roles and session scheme pending ADR-002 item 2
  rules:
    - Identity is established server-side only. Request bodies, query parameters and browser-chosen headers never carry enterpriseId, userId or roles.
    - Every business path returns Unauthenticated (401) without identity and Forbidden (403) without a grant; no business path exists yet.
    - CSRF remains at framework default until the session/token scheme is decided.
