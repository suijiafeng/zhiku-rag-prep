openapi: 3.1.0
info:
  title: 知库 scaffold API
  version: 0.1.0-draft
  description: PRD v0.3. Bearer JWT (HS256, locally issued for development) on every /api path except status. SSE schemas are provisional.
servers:
  - url: http://127.0.0.1:8080
security:
  - bearer: []
paths:
  /api/status:
    get:
      operationId: getStatus
      security: []
      responses:
        '200':
          description: Non-sensitive capability summary; no secrets, URLs or business data
          content:
            application/json:
              schema:
                type: object
                required: [name, stage, prdVersion, modelEnabled]
                properties:
                  name: {type: string}
                  stage: {type: string}
                  prdVersion: {type: string, const: '0.3'}
                  modelEnabled: {type: boolean}
                  chatModel: {type: [string, 'null']}
                  embeddingModel: {type: [string, 'null']}
                  retrieval: {type: string}
                  businessTimeZone: {type: string}
                  maxUploadBytes: {type: integer}
                  uploadFormats: {type: array, items: {type: string}}
  /api/chat:
    post:
      operationId: chat
      description: >-
        ASK_AND_CITE on kbId. Authorization, conversation ownership and model availability fail as JSON (401/403/422/503)
        before streaming. Otherwise text/event-stream per x-sse. Widget tokens may call only this endpoint and feedback.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [question, kbId]
              properties:
                question: {type: string, minLength: 1, maxLength: 2000}
                kbId: {type: string, format: uuid}
                conversationId: {type: string, format: uuid, description: Own conversation in the same knowledge base}
                clientRequestId:
                  type: string
                  format: uuid
                  description: >-
                    Optional, generated by the client per question. Accepted once per user; only a SHA-256 digest of
                    kbId, conversationId and question is stored. A repeat returns 409 REQUEST_DUPLICATE (same question)
                    or REQUEST_CONFLICT (different question) as JSON and never starts another generation; clients look up
                    the outcome instead of posting again.
      responses:
        '200': {description: SSE stream, content: {text/event-stream: {schema: {type: string}}}}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
  /api/chat/requests/{clientRequestId}:
    parameters: [{name: clientRequestId, in: path, required: true, schema: {type: string, format: uuid}}]
    get:
      operationId: chatRequestOutcome
      description: >-
        Caller's own request only (404 otherwise); ASK_AND_CITE on its knowledge base is re-checked (403). Returns ids and
        status, never answer text: read the answer from conversation history, which re-checks its sources. running means
        accepted without an outcome yet; interrupted means no outcome within the stream timeout. Not available to widget tokens.
      responses:
        '200':
          description: Outcome
          content:
            application/json:
              schema:
                type: object
                required: [status, acceptedAt]
                properties:
                  status: {type: string, enum: [running, interrupted, complete, refused, cancelled, failed]}
                  conversationId: {type: string, format: uuid}
                  messageId: {type: string, format: uuid}
                  acceptedAt: {type: string, format: date-time}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/Error'}
  /api/conversations:
    get:
      operationId: listConversations
      description: Caller's own conversations in knowledge bases still granted.
      responses:
        '200': {description: Conversations}
        '401': {$ref: '#/components/responses/Unauthenticated'}
  /api/conversations/{id}/messages:
    parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
    get:
      operationId: listMessages
      description: >-
        Own conversation only; knowledge base must still be granted. Each stored answer is re-checked against its source
        dependencies: if any source version is withdrawn, deleted or re-indexed, the answer and citations are hidden
        (hidden=true, reason=SOURCE_UNAVAILABLE). stale=true means a source is no longer the currently effective version.
        Non-complete turns carry status and errorCode with answer null.
      responses:
        '200': {description: Messages}
        '403': {$ref: '#/components/responses/Forbidden'}
  /api/messages/{messageId}/feedback:
    parameters: [{name: messageId, in: path, required: true, schema: {type: string, format: uuid}}]
    put:
      operationId: rateMessage
      description: >-
        Only the person who asked, while the knowledge base is still granted. down requires reason
        (WRONG | MISSING | BAD_CITATION | SHOULD_REFUSE | OUTDATED); up clears the reason. Each change increments
        version and is kept in history. Feedback never creates a trusted answer by itself.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rating]
              properties:
                rating: {type: string, enum: [up, down]}
                reason: {type: string}
                comment: {type: string, maxLength: 500}
      responses:
        '200': {description: Stored feedback}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/Error'}
  /api/knowledge-bases/{kbId}/records:
    parameters: [{$ref: '#/components/parameters/kbId'}, {name: filter, in: query, schema: {type: string, enum: [all, up, down, none], default: all}}]
    get:
      operationId: listRecords
      description: >-
        DEBUG_AND_EVALUATE (KB_OPERATOR). Latest 200 answers with feedback and handling status, plus 7-day stats.
        question and comment are null for other people's records unless READ_OTHERS_CONVERSATIONS is granted (no role has it yet).
      responses:
        '200': {description: Records}
        '403': {$ref: '#/components/responses/Forbidden'}
  /api/knowledge-bases/{kbId}/feedback/{messageId}:
    parameters: [{$ref: '#/components/parameters/kbId'}, {name: messageId, in: path, required: true, schema: {type: string, format: uuid}}]
    patch:
      operationId: updateFeedbackStatus
      description: >-
        DEBUG_AND_EVALUATE. status open | in_progress | to_verify | resolved | wont_fix; rootCause must be a PRD chapter 11
        category. Closing needs a basis: resolved requires rootCause, resolution and verificationCaseId of an approved case
        in this knowledge base made from the current version of this feedback (originMessageId) whose evidence spans were all retrieved in the latest evaluation run, with no evidence source withdrawn, deleted, not ready or re-indexed since that run (a retrieval check, not
        proof that the answer is correct); wont_fix requires resolution as the reason. Every change is kept in the handling
        history. Audited.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: {type: string}
                rootCause: {type: string}
                resolution: {type: string, maxLength: 1000}
                verificationCaseId: {type: string, format: uuid}
      responses:
        '204': {description: Updated}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
  /api/knowledge-bases/{kbId}/feedback/{messageId}/history:
    parameters: [{$ref: '#/components/parameters/kbId'}, {name: messageId, in: path, required: true, schema: {type: string, format: uuid}}]
    get:
      operationId: feedbackHandlingHistory
      description: DEBUG_AND_EVALUATE. Handling changes in order; empty when the message is not in this knowledge base.
      responses:
        '200':
          description: Handling history
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    status: {type: string}
                    rootCause: {type: string}
                    resolution: {type: string}
                    verificationCaseId: {type: string, format: uuid}
                    changedBy: {type: string, format: uuid}
                    changedAt: {type: string, format: date-time}
                    feedbackVersion: {type: integer, description: Feedback version the change was made for}
        '403': {$ref: '#/components/responses/Forbidden'}
  /api/widget-tokens:
    post:
      operationId: issueWidgetToken
      description: >-
        Exchanges a user token for a 10-minute widget token limited to one granted knowledge base, role EMPLOYEE,
        and the chat endpoint. Widget tokens cannot mint tokens. Audited. Host pages must not persist it.
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [kbId], properties: {kbId: {type: string, format: uuid}}}}}}
      responses:
        '201': {description: Issued, content: {application/json: {schema: {type: object, required: [token, expiresAt], properties: {token: {type: string}, expiresAt: {type: string, format: date-time}}}}}}
        '403': {$ref: '#/components/responses/Forbidden'}
        '503': {$ref: '#/components/responses/Error'}
  /api/knowledge-bases:
    get:
      operationId: listKnowledgeBases
      description: Knowledge bases currently granted to the caller. Grants are re-read on every request.
      responses:
        '200':
          description: Granted knowledge bases
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/KnowledgeBase'}}
        '401': {$ref: '#/components/responses/Unauthenticated'}
    post:
      operationId: createKnowledgeBase
      description: IT_ADMIN only. Created in the caller's enterprise; any enterprise field in the body is ignored. Creator is not granted automatically.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: {type: string, minLength: 1, maxLength: 100}
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/KnowledgeBase'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
  /api/me:
    get:
      operationId: me
      description: Identity from the verified token plus knowledge bases granted right now.
      responses:
        '200':
          description: Caller
          content:
            application/json:
              schema:
                type: object
                properties:
                  userId: {type: string, format: uuid}
                  enterpriseId: {type: string, format: uuid}
                  roles: {type: array, items: {type: string}}
                  knowledgeBaseIds: {type: array, items: {type: string, format: uuid}}
        '401': {$ref: '#/components/responses/Unauthenticated'}
  /api/policy/roles:
    get:
      operationId: rolePolicy
      description: Server role matrix (roles x knowledge-base actions -> ALLOWED | REQUIRES_EXPLICIT_GRANT | NEVER). Explicit grants are not modelled yet and are denied.
      responses:
        '200': {description: Matrix}
        '401': {$ref: '#/components/responses/Unauthenticated'}
  /api/admin/knowledge-bases:
    get:
      operationId: adminListKnowledgeBases
      description: IT_ADMIN only. All knowledge bases of the caller's enterprise with member counts, including ones the admin is not granted.
      responses:
        '200': {description: Knowledge bases}
        '403': {$ref: '#/components/responses/Forbidden'}
  /api/knowledge-bases/{kbId}/grants:
    parameters: [{$ref: '#/components/parameters/kbId'}]
    get:
      operationId: listGrants
      description: IT_ADMIN of the same enterprise. User ids and grant times only; user profiles live in the identity provider.
      responses:
        '200': {description: Grants}
        '403': {$ref: '#/components/responses/Forbidden'}
  /api/knowledge-bases/{kbId}/grants/{userId}:
    parameters:
      - {name: kbId, in: path, required: true, schema: {type: string, format: uuid}}
      - {name: userId, in: path, required: true, schema: {type: string, format: uuid}}
    put:
      operationId: grantKnowledgeBase
      description: IT_ADMIN of the same enterprise. Audited. Unknown and foreign knowledge bases both return 403.
      responses:
        '204': {description: Granted}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
    delete:
      operationId: revokeKnowledgeBase
      description: IT_ADMIN of the same enterprise. Audited. Takes effect on the next request.
      responses:
        '204': {description: Revoked}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /api/knowledge-bases/{kbId}/documents:
    parameters: [{$ref: '#/components/parameters/kbId'}]
    get:
      operationId: listDocuments
      description: Requires grant + ASK_AND_CITE role. Versions carry business state and index state separately.
      responses:
        '200': {description: Documents with versions, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/Document'}}}}}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      operationId: createDocument
      description: Requires grant + MANAGE_DOCUMENTS (KB_OPERATOR). Audited.
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [title], properties: {title: {type: string, maxLength: 200}}}}}}
      responses:
        '201': {description: Created, content: {application/json: {schema: {$ref: '#/components/schemas/Created'}}}}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/Error'}
  /api/knowledge-bases/{kbId}/documents/{documentId}:
    parameters: [{$ref: '#/components/parameters/kbId'}, {name: documentId, in: path, required: true, schema: {type: string, format: uuid}}]
    delete:
      operationId: deleteDocument
      description: >-
        MANAGE_DOCUMENTS. Audited. Access stops immediately: the document's versions leave eligibility, retrieval,
        citations, evaluation evidence and overview counts, and history answers that depend on them are hidden.
        Content, chunks, vectors and ingestion jobs are removed later by a background cleanup whose state is shown
        in Document.deletion. Deleting again re-queues a cleanup that failed; otherwise it changes nothing.
        Backups are outside this cleanup.
      responses:
        '202': {description: Access stopped; cleanup queued}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /api/knowledge-bases/{kbId}/documents/{documentId}/versions:
    parameters: [{$ref: '#/components/parameters/kbId'}, {name: documentId, in: path, required: true, schema: {type: string, format: uuid}}]
    post:
      operationId: createVersion
      description: Business dates are local dates in zhiku.business.time-zone (Asia/Shanghai), stored as UTC; interval is [from, until).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [versionLabel, effectiveFrom]
              properties:
                versionLabel: {type: string, maxLength: 50}
                effectiveFrom: {type: string, format: date}
                effectiveUntil: {type: string, format: date}
      responses:
        '201': {description: Created, content: {application/json: {schema: {$ref: '#/components/schemas/Created'}}}}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
  /api/knowledge-bases/{kbId}/documents/{documentId}/versions/{versionId}/{transition}:
    parameters:
      - {$ref: '#/components/parameters/kbId'}
      - {name: documentId, in: path, required: true, schema: {type: string, format: uuid}}
      - {name: versionId, in: path, required: true, schema: {type: string, format: uuid}}
      - {name: transition, in: path, required: true, schema: {type: string, enum: [approve, publish, withdraw]}}
    post:
      operationId: transitionVersion
      description: MANAGE_DOCUMENTS. Publish requires prior approval. Audited. Invalid state returns 409.
      responses:
        '204': {description: Done}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Error'}
  /api/knowledge-bases/{kbId}/documents/{documentId}/versions/{versionId}/content:
    parameters:
      - {$ref: '#/components/parameters/kbId'}
      - {name: documentId, in: path, required: true, schema: {type: string, format: uuid}}
      - {name: versionId, in: path, required: true, schema: {type: string, format: uuid}}
    put:
      operationId: uploadContent
      description: >-
        MANAGE_DOCUMENTS. UTF-8 .md/.markdown/.txt only (client content type ignored), non-empty, no binary control
        characters, at most 20 MB. Content is immutable per version. The file and a queued job are stored in one
        transaction; parsing and chunking run later in the durable worker. Audited with size and SHA-256 only.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: {type: object, required: [file], properties: {file: {type: string, format: binary}}}
      responses:
        '202': {description: Queued, content: {application/json: {schema: {type: object, required: [jobId], properties: {jobId: {type: string, format: uuid}}}}}}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Error'}
        '413': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
  /api/knowledge-bases/{kbId}/documents/{documentId}/versions/{versionId}/reindex:
    parameters:
      - {$ref: '#/components/parameters/kbId'}
      - {name: documentId, in: path, required: true, schema: {type: string, format: uuid}}
      - {name: versionId, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      operationId: reindexVersion
      description: Re-queues a succeeded or failed job; 409 while queued or running. Chunks are replaced, never duplicated.
      responses:
        '202': {description: Queued}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Error'}
  /api/knowledge-bases/{kbId}/config:
    parameters: [{$ref: '#/components/parameters/kbId'}]
    get:
      operationId: knowledgeBaseConfig
      description: >-
        DEBUG_AND_EVALUATE. Published version (null means deployment defaults apply, reported as defaults), the single
        candidate if any, and the version history. Configurable here: retrievalK (1..max-k), contextChunks (1..20, at
        most retrievalK; the chunks given to the model), handoffChannel, promptAddendum (appended to the fixed system
        prompt). Embedding and chunking are deployment settings: changing them re-indexes everything and is not done here.
      responses:
        '200':
          description: Overview
          content:
            application/json:
              schema:
                type: object
                properties:
                  published: {$ref: '#/components/schemas/KnowledgeBaseConfig'}
                  candidate: {$ref: '#/components/schemas/KnowledgeBaseConfig'}
                  history: {type: array, items: {$ref: '#/components/schemas/KnowledgeBaseConfig'}}
                  defaults: {type: object, properties: {retrievalK: {type: integer}, contextChunks: {type: integer}, handoffChannel: {type: string}}}
        '403': {$ref: '#/components/responses/Forbidden'}
  /api/knowledge-bases/{kbId}/config/candidate:
    parameters: [{$ref: '#/components/parameters/kbId'}]
    put:
      operationId: saveConfigCandidate
      description: >-
        DEBUG_AND_EVALUATE. Creates the candidate (no expectedRevision) or updates it (expectedRevision must equal the
        candidate's current revision, else 409 CONFIG_CONFLICT: reload and confirm again). Any update clears a previous
        validation. Bounds violations are 422. Audited.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [retrievalK, contextChunks]
              properties:
                retrievalK: {type: integer, minimum: 1, maximum: 30}
                contextChunks: {type: integer, minimum: 1, maximum: 20}
                handoffChannel: {type: string, maxLength: 200}
                promptAddendum: {type: string, maxLength: 1000}
                note: {type: string, maxLength: 500}
                expectedRevision: {type: integer}
      responses:
        '200': {description: Candidate, content: {application/json: {schema: {$ref: '#/components/schemas/KnowledgeBaseConfig'}}}}
        '409': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
  /api/knowledge-bases/{kbId}/config/candidate/{action}:
    parameters: [{$ref: '#/components/parameters/kbId'}, {name: action, in: path, required: true, schema: {type: string, enum: [validate, publish]}}]
    post:
      operationId: configCandidateAction
      description: >-
        DEBUG_AND_EVALUATE. validate runs one real retrieval at the candidate's K (503 when retrieval is unavailable) and
        one retrieval evaluation run, recorded as the basis; humanQualityChecked is always false (not measured here).
        publish needs a validation of the current revision (else 409) and makes the candidate the next published version;
        the previous one becomes superseded. New chat requests use it; requests in flight keep theirs. Audited.
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [expectedRevision], properties: {expectedRevision: {type: integer}}}}}}
      responses:
        '200': {description: Updated config, content: {application/json: {schema: {$ref: '#/components/schemas/KnowledgeBaseConfig'}}}}
        '409': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
  /api/knowledge-bases/{kbId}/config/versions/{version}/rollback:
    parameters: [{$ref: '#/components/parameters/kbId'}, {name: version, in: path, required: true, schema: {type: integer}}]
    post:
      operationId: rollbackConfig
      description: DEBUG_AND_EVALUATE. Republishes an earlier version's values as a new version (rolledBackFrom set); history stays linear. 404 for unknown versions. Audited.
      responses:
        '200': {description: New published version, content: {application/json: {schema: {$ref: '#/components/schemas/KnowledgeBaseConfig'}}}}
        '404': {$ref: '#/components/responses/Error'}
  /api/knowledge-bases/{kbId}/traces/{traceId}:
    parameters: [{$ref: '#/components/parameters/kbId'}, {name: traceId, in: path, required: true, schema: {type: string, format: uuid}}]
    get:
      operationId: retrievalTrace
      description: >-
        DEBUG_AND_EVALUATE. Stored trace of one retrieval from chat, debug or evaluation (same retrieval path). Metadata
        only: no question, chunk text or vectors. Chat traces add a generation stage and link the stored messageId.
        Candidates of deleted documents keep ids and scores without a title. 404 when the trace is not in this
        knowledge base. Retention period is not decided yet (ADR-002).
      responses:
        '200':
          description: Trace
          content:
            application/json:
              schema:
                type: object
                properties:
                  traceId: {type: string, format: uuid}
                  origin: {type: string, enum: [chat, debug, evaluation]}
                  at: {type: string, format: date-time}
                  k: {type: integer}
                  embeddingModel: {type: string}
                  dimension: {type: integer}
                  messageId: {type: string, format: uuid}
                  createdAt: {type: string, format: date-time}
                  configVersion: {type: integer}
                  stages: {type: array, items: {type: object}}
                  candidates:
                    type: array
                    items:
                      type: object
                      properties:
                        rank: {type: integer}
                        chunkId: {type: string, format: uuid}
                        versionId: {type: string, format: uuid}
                        documentTitle: {type: string}
                        score: {type: number}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/Error'}
  /api/knowledge-bases/{kbId}/retrieval-debug:
    parameters: [{$ref: '#/components/parameters/kbId'}]
    post:
      operationId: retrievalDebug
      description: >-
        DEBUG_AND_EVALUATE (KB_OPERATOR). Eligible versions are resolved from grants and effectivity before any vector
        comparison; exact cosine search within one embedding model and dimension. Stages that did not run are reported
        as skipped. 503 when no embedding model is configured or it is unavailable. Every search, including failed
        ones, keeps a trace under traceId (see /traces/{traceId}).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [query]
              properties:
                query: {type: string, minLength: 1, maxLength: 2000}
                k: {type: integer, minimum: 1, maximum: 30, default: 8}
                at: {type: string, format: date-time}
      responses:
        '200': {description: Trace, content: {application/json: {schema: {$ref: '#/components/schemas/RetrievalTrace'}}}}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
  /api/knowledge-bases/{kbId}/overview:
    parameters: [{$ref: '#/components/parameters/kbId'}]
    get:
      operationId: knowledgeBaseOverview
      description: >-
        ASK_AND_CITE. Counts of documents, versions, ready versions, chunks and vectors; questions today/yesterday and a
        7-day daily series by business day (zhiku.business.time-zone); 7-day feedback; embedding spaces (model, dimension,
        vectors); last successful index time; 5 recent documents and questions. Other people's question text is null.
      responses:
        '200': {description: Overview}
        '403': {$ref: '#/components/responses/Forbidden'}
  /api/knowledge-bases/{kbId}/eval-cases:
    parameters: [{$ref: '#/components/parameters/kbId'}]
    get:
      operationId: listEvalCases
      description: DEBUG_AND_EVALUATE. Cases with their evidence spans (version, character offsets, quote). Once the source version is withdrawn or its document deleted, quote is null and available is false; the span metadata stays.
      responses:
        '200': {description: Cases}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      operationId: createEvalCase
      description: >-
        DEBUG_AND_EVALUATE. label answerable | clarify | handoff. Candidates may start without evidence (e.g. from feedback). Null entries and the same span twice are rejected (422). Each evidence quote must be
        found in the normalized text of a version in this knowledge base; it is stored as a character span, not a chunk id.
        New cases are candidates until approved. Audited.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [question, label]
              properties:
                question: {type: string, maxLength: 2000}
                label: {type: string, enum: [answerable, clarify, handoff]}
                source: {type: string}
                evidence:
                  type: array
                  maxItems: 10
                  items: {type: object, required: [versionId, quote], properties: {versionId: {type: string, format: uuid}, quote: {type: string, maxLength: 2000}, occurrence: {type: integer, minimum: 1, description: 'Which match to use (1-based); required when the quote occurs more than once (422 otherwise)'}}}
                originMessageId: {type: string, format: uuid, description: Feedback message the case was made from; must be in this knowledge base (422)}
                expectedAnswer: {type: string, maxLength: 2000}
                requiredFacts: {type: array, maxItems: 10, items: {type: string, minLength: 1, maxLength: 200}}
                appliesTo: {type: string, maxLength: 200}
                queryAt: {type: string, format: date-time, description: Effectivity time the case is evaluated at; default the run time}
      responses:
        '201': {description: Created}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/Error'}
  /api/knowledge-bases/{kbId}/eval-cases/{caseId}/details:
    parameters: [{$ref: '#/components/parameters/kbId'}, {name: caseId, in: path, required: true, schema: {type: string, format: uuid}}]
    put:
      operationId: setEvalCaseDetails
      description: >-
        DEBUG_AND_EVALUATE. Sets the reference answer, required facts (at most 10, 1–200 characters), applicable audience
        and query time of a candidate. Approved cases are frozen (409). Audited.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                expectedAnswer: {type: string, maxLength: 2000}
                requiredFacts: {type: array, maxItems: 10, items: {type: string}}
                appliesTo: {type: string, maxLength: 200}
                queryAt: {type: string, format: date-time}
      responses:
        '204': {description: Updated}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
  /api/knowledge-bases/{kbId}/eval-cases/{caseId}/approve:
    parameters: [{$ref: '#/components/parameters/kbId'}, {name: caseId, in: path, required: true, schema: {type: string, format: uuid}}]
    post:
      operationId: approveEvalCase
      description: Candidate -> approved; answerable cases need evidence, a reference answer and at least one required fact first (422). Only approved cases are evaluated. Audited.
      responses:
        '204': {description: Approved}
        '409': {$ref: '#/components/responses/Error'}
  /api/knowledge-bases/{kbId}/eval-cases/{caseId}/evidence:
    parameters: [{$ref: '#/components/parameters/kbId'}, {name: caseId, in: path, required: true, schema: {type: string, format: uuid}}]
    put:
      operationId: setEvalEvidence
      description: Replaces a candidate's evidence (same quote rules as create). Approved cases are frozen (409); an approval in progress finishes first. Audited.
      responses:
        '204': {description: Updated}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
  /api/knowledge-bases/{kbId}/eval-runs:
    parameters: [{$ref: '#/components/parameters/kbId'}]
    post:
      operationId: runEvaluation
      description: >-
        Retrieval evaluation of approved answerable cases with the caller's authorized scope; no model call.
        Cases whose evidence version is not eligible now (withdrawn, deleted, expired) are counted as sourceUnavailable,
        before and after deletion cleanup alike. Spans are mapped onto current chunks; unmappable cases are preparation
        failures. Both are excluded from denominators. A span counts as retrieved only when the retrieved chunks cover all
        of it. Reports Hit@K, evidence recall (spans and macro), P95 retrieval latency. Answer correctness is not measured here.
      requestBody: {content: {application/json: {schema: {type: object, properties: {k: {type: integer, minimum: 1, maximum: 30, default: 5}}}}}}
      responses:
        '200': {description: Run with results}
        '403': {$ref: '#/components/responses/Forbidden'}
        '503': {$ref: '#/components/responses/Error'}
  /api/knowledge-bases/{kbId}/eval-runs/latest:
    parameters: [{$ref: '#/components/parameters/kbId'}]
    get:
      operationId: latestEvaluationRun
      responses:
        '200': {description: Latest run}
        '204': {description: No run yet}
  /api/knowledge-bases/{kbId}/eligibility:
    parameters: [{$ref: '#/components/parameters/kbId'}, {name: at, in: query, schema: {type: string, format: date-time}}]
    get:
      operationId: versionEligibility
      description: Per-document outcome at a time (default now). versionId only when ELIGIBLE; never falls back to an older version.
      responses:
        '200':
          description: Outcomes
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [documentId, title, outcome]
                  properties:
                    documentId: {type: string, format: uuid}
                    title: {type: string}
                    outcome: {type: string, enum: [ELIGIBLE, NO_EVIDENCE, CONFLICT, INDEX_NOT_READY]}
                    versionId: {type: string, format: uuid}
components:
  parameters:
    kbId: {name: kbId, in: path, required: true, schema: {type: string, format: uuid}}
  securitySchemes:
    bearer: {type: http, scheme: bearer, bearerFormat: JWT}
  responses:
    Error:
      description: Contract error body
      headers:
        X-Request-Id: {schema: {type: string}}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Unauthenticated:
      description: No trusted server-side identity. Body never reveals whether the path or resource exists.
      headers:
        X-Request-Id: {schema: {type: string}}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
          example: {code: UNAUTHENTICATED, message: Authentication required, requestId: 00000000-0000-0000-0000-000000000000}
    Forbidden:
      description: Identity exists but the role or grant is missing. Identical for foreign and unknown targets.
      headers:
        X-Request-Id: {schema: {type: string}}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
          example: {code: FORBIDDEN, message: Access denied, requestId: 00000000-0000-0000-0000-000000000000}
  schemas:
    RetrievalTrace:
      type: object
      required: [traceId, question, stages, candidates]
      properties:
        traceId: {type: string, format: uuid}
        question: {type: string}
        at: {type: string, format: date-time}
        embeddingModel: {type: string}
        dimension: {type: integer}
        stages:
          type: array
          items:
            type: object
            properties:
              key: {type: string}
              name: {type: string}
              status: {type: string, enum: [success, failed, skipped, cancelled]}
              startedAt: {type: string, format: date-time, description: null for skipped stages}
              endedAt: {type: string, format: date-time}
              elapsedMs: {type: integer}
              summary: {type: string}
        candidates:
          type: array
          items:
            type: object
            properties:
              chunkId: {type: string, format: uuid}
              documentId: {type: string, format: uuid}
              title: {type: string}
              versionId: {type: string, format: uuid}
              versionLabel: {type: string}
              seq: {type: integer}
              heading: {type: string}
              startOffset: {type: integer}
              endOffset: {type: integer}
              text: {type: string}
              score: {type: number, description: cosine similarity; not a confidence in the answer}
              rank: {type: integer}
    KnowledgeBaseConfig:
      type: object
      properties:
        id: {type: string, format: uuid}
        version: {type: integer, description: null for the candidate}
        status: {type: string, enum: [candidate, published, superseded]}
        revision: {type: integer, description: Optimistic-lock revision of the candidate}
        retrievalK: {type: integer}
        contextChunks: {type: integer}
        handoffChannel: {type: string}
        promptAddendum: {type: string}
        note: {type: string}
        createdBy: {type: string, format: uuid}
        createdAt: {type: string, format: date-time}
        validatedAt: {type: string, format: date-time}
        validation: {type: object, properties: {evaluationRunId: {type: string, format: uuid}, cases: {type: integer}, humanQualityChecked: {type: boolean}}}
        publishedBy: {type: string, format: uuid}
        publishedAt: {type: string, format: date-time}
        rolledBackFrom: {type: integer}
    Created:
      type: object
      required: [id]
      properties:
        id: {type: string, format: uuid}
    Document:
      type: object
      required: [id, title, versions]
      properties:
        id: {type: string, format: uuid}
        title: {type: string}
        createdAt: {type: string, format: date-time}
        versions:
          type: array
          items:
            type: object
            properties:
              id: {type: string, format: uuid}
              versionLabel: {type: string}
              effectiveFrom: {type: string, format: date-time}
              effectiveUntil: {type: string, format: date-time}
              approved: {type: boolean}
              published: {type: boolean}
              withdrawn: {type: boolean}
              superseded: {type: boolean}
              indexStatus: {type: string, enum: [pending, processing, ready, failed]}
              indexError: {type: string}
        deletion:
          description: Present only for deleted documents (they have no versions). status is the content cleanup state.
          type: object
          required: [status, deletedAt]
          properties:
            status: {type: string, enum: [pending, running, done, failed]}
            deletedAt: {type: string, format: date-time}
            error: {type: string}
    KnowledgeBase:
      type: object
      required: [id, name]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
    Error:
      type: object
      required: [code, message, requestId]
      properties:
        code: {type: string}
        message: {type: string}
        requestId: {type: string}
    Draft:
      type: object
      required: [text]
      properties:
        text: {type: string}
    Citation:
      type: object
      required: [documentId, versionId, title, excerpt]
      properties:
        documentId: {type: string}
        versionId: {type: string}
        title: {type: string}
        excerpt: {type: string}
    Validated:
      type: object
      description: Source metadata checks only; not semantic verification.
      required: [citations, validation]
      properties:
        citations:
          type: array
          items: {$ref: '#/components/schemas/Citation'}
        validation: {type: string, const: metadata-only}
    Done:
      type: object
      required: [status]
      properties:
        status: {type: string, const: complete}
x-sse:
  status: implemented (POST /api/chat)
  events: [start, draft, validated, error, done]
  fields:
    start: {requestId: string, traceId: uuid, configVersion: "integer (0 = deployment defaults)", clientRequestId: "uuid (when sent)"}
    draft: {text: string, seq: "integer, 1-based, increasing"}
    validated: {citations: array, validation: metadata-only}
    done: {status: complete, finishReason: stop, conversationId: uuid, messageId: uuid, traceId: uuid, latencyMs: integer}
    error: {code: string, message: string, requestId: string, traceId: uuid, retryable: boolean, discardDraft: true}
  notYetReported: [message_id in start (assigned when the answer is stored), token usage]
  rules:
    - All events use JSON data. Start comes first; error is terminal; done requires preceding validated.
    - While waiting the server sends SSE comment lines (":keepalive", every zhiku.chat.heartbeat-interval); they are not content and clients ignore them.
    - A question containing an ID card, bank card or mobile number (format match only; may miss or over-match) ends with SENSITIVE_INPUT before retrieval and the model; the turn is stored as refused with the numbers replaced by [已隐藏]. Refusals point to zhiku.chat.handoff-channel, or say it is not configured.
    - retryable is true only for MODEL_UNAVAILABLE and DEPENDENCY_UNAVAILABLE; a retry is a new question with a new clientRequestId, never an automatic re-POST.
    - Draft is provisional. Metadata validation does not establish semantic correctness.
    - Disconnect, cancellation or error must not preserve a usable answer. Every turn is stored with status complete | refused (NO_EVIDENCE) | cancelled | failed; only complete turns keep answer text and sources, and only they enter follow-up context or accept feedback.
    - validated.citations lists every source given to the model in order; marker [n] refers to citations[n-1].
    - done.data includes conversationId (to continue), messageId (for feedback) and traceId; error.data includes traceId once retrieval has started.
    - Before validated the server checks that markers exist and are in range, then re-reads grants and version eligibility.
    - Follow-ups (conversationId) use at most the last three prior turns as non-evidence context; turns with unavailable sources are excluded entirely, answers based on non-current versions keep only the question. Retrieval uses the previous visible question plus the new one; facts still come only from freshly retrieved eligible sources.
  errorCodes: [NO_EVIDENCE, SENSITIVE_INPUT, CITATION_INVALID, ACCESS_REVOKED, SOURCE_UNAVAILABLE, MODEL_UNAVAILABLE, DEPENDENCY_UNAVAILABLE, ANSWER_TOO_LONG]
x-auth:
  status: implemented (local HS256 issuer; OIDC provider replaceable)
  claims:
    iss: zhiku-local
    aud: zhiku-api
    sub: user id (uuid)
    enterprise_id: enterprise id (uuid)
    roles: "array of IT_ADMIN, KB_OPERATOR, EMPLOYEE (PRD v0.3 suggested mapping)"
    exp: required
  widgetToken: {token_use: widget, kb_scope: [kbId], roles: [EMPLOYEE], ttl: PT10M, allowed: ["POST /api/chat", "PUT /api/messages/{id}/feedback"]}
  rules:
    - Identity comes only from the verified token. Bodies, query parameters and other headers never carry enterpriseId, userId or roles.
    - Knowledge base grants are read from the database on every request, so revocation applies to the next request.
    - Stateless; no cookies or sessions, so CSRF protection is not applicable. CORS only for zhiku.widget.allowed-origins on POST /api/chat and PUT /api/messages/{id}/feedback, without credentials.
