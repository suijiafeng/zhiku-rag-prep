openapi: 3.1.0
info:
  title: 知库 scaffold API
  version: 0.1.0-draft
  description: PRD v0.3. Bearer JWT (HS256, locally issued for development) on every /api path except status. SSE schemas are provisional.
servers:
  - url: http://127.0.0.1:8080
security:
  - bearer: []
paths:
  /api/status:
    get:
      operationId: getStatus
      security: []
      responses:
        '200':
          description: Non-sensitive scaffold status
          content:
            application/json:
              schema:
                type: object
                required: [name, stage, prdVersion, modelEnabled]
                properties:
                  name: {type: string}
                  stage: {type: string, const: scaffold}
                  prdVersion: {type: string, const: '0.3'}
                  modelEnabled: {type: boolean, const: false}
  /api/knowledge-bases:
    get:
      operationId: listKnowledgeBases
      description: Knowledge bases currently granted to the caller. Grants are re-read on every request.
      responses:
        '200':
          description: Granted knowledge bases
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/KnowledgeBase'}}
        '401': {$ref: '#/components/responses/Unauthenticated'}
    post:
      operationId: createKnowledgeBase
      description: IT_ADMIN only. Created in the caller's enterprise; any enterprise field in the body is ignored. Creator is not granted automatically.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: {type: string, minLength: 1, maxLength: 100}
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/KnowledgeBase'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
  /api/knowledge-bases/{kbId}/grants/{userId}:
    parameters:
      - {name: kbId, in: path, required: true, schema: {type: string, format: uuid}}
      - {name: userId, in: path, required: true, schema: {type: string, format: uuid}}
    put:
      operationId: grantKnowledgeBase
      description: IT_ADMIN of the same enterprise. Audited. Unknown and foreign knowledge bases both return 403.
      responses:
        '204': {description: Granted}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
    delete:
      operationId: revokeKnowledgeBase
      description: IT_ADMIN of the same enterprise. Audited. Takes effect on the next request.
      responses:
        '204': {description: Revoked}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /api/knowledge-bases/{kbId}/documents:
    parameters: [{$ref: '#/components/parameters/kbId'}]
    get:
      operationId: listDocuments
      description: Requires grant + ASK_AND_CITE role. Versions carry business state and index state separately.
      responses:
        '200': {description: Documents with versions, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/Document'}}}}}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      operationId: createDocument
      description: Requires grant + MANAGE_DOCUMENTS (KB_OPERATOR). Audited.
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [title], properties: {title: {type: string, maxLength: 200}}}}}}
      responses:
        '201': {description: Created, content: {application/json: {schema: {$ref: '#/components/schemas/Created'}}}}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/Error'}
  /api/knowledge-bases/{kbId}/documents/{documentId}/versions:
    parameters: [{$ref: '#/components/parameters/kbId'}, {name: documentId, in: path, required: true, schema: {type: string, format: uuid}}]
    post:
      operationId: createVersion
      description: Business dates are local dates in zhiku.business.time-zone (Asia/Shanghai), stored as UTC; interval is [from, until).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [versionLabel, effectiveFrom]
              properties:
                versionLabel: {type: string, maxLength: 50}
                effectiveFrom: {type: string, format: date}
                effectiveUntil: {type: string, format: date}
      responses:
        '201': {description: Created, content: {application/json: {schema: {$ref: '#/components/schemas/Created'}}}}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
  /api/knowledge-bases/{kbId}/documents/{documentId}/versions/{versionId}/{transition}:
    parameters:
      - {$ref: '#/components/parameters/kbId'}
      - {name: documentId, in: path, required: true, schema: {type: string, format: uuid}}
      - {name: versionId, in: path, required: true, schema: {type: string, format: uuid}}
      - {name: transition, in: path, required: true, schema: {type: string, enum: [approve, publish, withdraw]}}
    post:
      operationId: transitionVersion
      description: MANAGE_DOCUMENTS. Publish requires prior approval. Audited. Invalid state returns 409.
      responses:
        '204': {description: Done}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Error'}
  /api/knowledge-bases/{kbId}/eligibility:
    parameters: [{$ref: '#/components/parameters/kbId'}, {name: at, in: query, schema: {type: string, format: date-time}}]
    get:
      operationId: versionEligibility
      description: Per-document outcome at a time (default now). versionId only when ELIGIBLE; never falls back to an older version.
      responses:
        '200':
          description: Outcomes
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [documentId, title, outcome]
                  properties:
                    documentId: {type: string, format: uuid}
                    title: {type: string}
                    outcome: {type: string, enum: [ELIGIBLE, NO_EVIDENCE, CONFLICT, INDEX_NOT_READY]}
                    versionId: {type: string, format: uuid}
components:
  parameters:
    kbId: {name: kbId, in: path, required: true, schema: {type: string, format: uuid}}
  securitySchemes:
    bearer: {type: http, scheme: bearer, bearerFormat: JWT}
  responses:
    Error:
      description: Contract error body
      headers:
        X-Request-Id: {schema: {type: string}}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Unauthenticated:
      description: No trusted server-side identity. Body never reveals whether the path or resource exists.
      headers:
        X-Request-Id: {schema: {type: string}}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
          example: {code: UNAUTHENTICATED, message: Authentication required, requestId: 00000000-0000-0000-0000-000000000000}
    Forbidden:
      description: Identity exists but the role or grant is missing. Identical for foreign and unknown targets.
      headers:
        X-Request-Id: {schema: {type: string}}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
          example: {code: FORBIDDEN, message: Access denied, requestId: 00000000-0000-0000-0000-000000000000}
  schemas:
    Created:
      type: object
      required: [id]
      properties:
        id: {type: string, format: uuid}
    Document:
      type: object
      required: [id, title, versions]
      properties:
        id: {type: string, format: uuid}
        title: {type: string}
        createdAt: {type: string, format: date-time}
        versions:
          type: array
          items:
            type: object
            properties:
              id: {type: string, format: uuid}
              versionLabel: {type: string}
              effectiveFrom: {type: string, format: date-time}
              effectiveUntil: {type: string, format: date-time}
              approved: {type: boolean}
              published: {type: boolean}
              withdrawn: {type: boolean}
              superseded: {type: boolean}
              indexStatus: {type: string, enum: [pending, processing, ready, failed]}
              indexError: {type: string}
    KnowledgeBase:
      type: object
      required: [id, name]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
    Error:
      type: object
      required: [code, message, requestId]
      properties:
        code: {type: string}
        message: {type: string}
        requestId: {type: string}
    Draft:
      type: object
      required: [text]
      properties:
        text: {type: string}
    Citation:
      type: object
      required: [documentId, versionId, title, excerpt]
      properties:
        documentId: {type: string}
        versionId: {type: string}
        title: {type: string}
        excerpt: {type: string}
    Validated:
      type: object
      description: Source metadata checks only; not semantic verification.
      required: [citations, validation]
      properties:
        citations:
          type: array
          items: {$ref: '#/components/schemas/Citation'}
        validation: {type: string, const: metadata-only}
    Done:
      type: object
      required: [status]
      properties:
        status: {type: string, const: complete}
x-sse-draft:
  status: provisional-not-implemented
  transport: POST with fetch; no route yet
  events: [draft, validated, error, done]
  rules:
    - All events use JSON data. Error is terminal. Done requires preceding validated.
    - Draft is provisional. Metadata validation does not establish semantic correctness.
    - Disconnect, cancellation or error must not preserve a usable answer.
x-auth:
  status: implemented (local HS256 issuer; OIDC provider replaceable)
  claims:
    iss: zhiku-local
    aud: zhiku-api
    sub: user id (uuid)
    enterprise_id: enterprise id (uuid)
    roles: "array of IT_ADMIN, KB_OPERATOR, EMPLOYEE (PRD v0.3 suggested mapping)"
    exp: required
  rules:
    - Identity comes only from the verified token. Bodies, query parameters and other headers never carry enterpriseId, userId or roles.
    - Knowledge base grants are read from the database on every request, so revocation applies to the next request.
    - Stateless; no cookies or sessions, so CSRF protection is not applicable. CORS is not enabled.
